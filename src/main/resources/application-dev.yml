spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_CLIENT_REDIRECT_URI}
            scope:
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${GITHUB_CLIENT_REDIRECT_URI}
            scope:
              - user:email
              - read:user
  cloud:
    openfeign:
      client:
        config:
          user-client:
            url: ${USER_SERVICE_URL}
            connect-timeout: 5000
            read-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  key-id: ${JWT_KEY_ID}
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}  # 1 hour
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}  # 24 hours
  issuer: ${JWT_ISSUER}

code:
  auth:
    expiration: ${AUTH_CODE_EXPIRATION:300000}  # 5 minutes

web:
  front-end-url: ${FRONTEND_URL}

email:
  allowed-domain: ${ALLOWED_EMAIL_DOMAIN}

logging:
  level:
    madp.auth: INFO
    org.springframework.security: WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"