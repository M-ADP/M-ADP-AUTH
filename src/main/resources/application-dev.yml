spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            redirect-uri: ${GOOGLE_CLIENT_REDIRECT_URI}
            scope:
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            redirect-uri: ${GITHUB_CLIENT_REDIRECT_URI}
            scope:
              - user:email
              - read:user
  cloud:
    openfeign:
      client:
        config:
          user-client:
            url: ${USER_SERVICE_URL:http://localhost:8080}

jwt:
  key-id: ${JWT_KEY_ID}
  secret: ${JWT_SECRET:dev-jwt-secret-key-that-should-be-very-long-and-secure}
  access-expiration: 3600000  # 1 hour
  refresh-expiration: 86400000  # 24 hours
  issuer: https://api.madp.cloud

code:
  auth:
    expiration: 300000  # 5 minutes

web:
  front-end-url: ${FRONTEND_URL:http://localhost:3000}
  back-end-url: ${BACKEND_URL:http://localhost:8080}

email:
  allowed-domain: ${ALLOWED_EMAIL_DOMAIN:@bssm.hs.kr}

logging:
  level:
    madp.auth: DEBUG
    org.springframework.security: DEBUG