spring:
  application:
    name: madp-auth-local
  config:
    import:
      - file:env/local.env[.properties]
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth2/callback/google}
            scope:
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth2/callback/github}
            scope:
              - user:email
              - read:user
  cloud:
    openfeign:
      client:
        config:
          user-client:
            url: ${USER_SERVICE_URL:http://localhost:8081}

jwt:
  key-id: ${JWT_KEY_ID}
  access-expiration: 3600000
  refresh-expiration: 86400000
  issuer: https://api.madp.cloud

code:
  auth:
    expiration: 600000

web:
  front-end-url: ${FRONTEND_URL:http://localhost:3000}

email:
  allowed-domain: ${ALLOWED_EMAIL_DOMAIN:@bssm.hs.kr}

server.port:
  8081

logging:
  level:
    madp.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    madp.auth.domain.infrastructure.client.UserClient: DEBUG
